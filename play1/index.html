<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <!-- 移动端 viewport：禁用缩放，避免双指缩放干扰游戏 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>3D 像素方块世界</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- 游戏画布容器，Three.js 的 canvas 会被插入到这里 -->
    <div id="game-container">
        <!-- 加载提示 -->
        <div id="loading">加载世界中...</div>

        <!-- 中心准星 -->
        <div id="crosshair"></div>

        <!-- 桌面端操作提示 / 开始按钮（点击后请求指针锁） -->
        <div id="start-screen">
            <div class="panel">
                <h1>3D 像素方块世界</h1>
                <p class="hint-desktop">
                    <b>桌面端：</b> 点击屏幕开始 · 鼠标移动视角 · WASD 移动 · 空格跳跃<br />
                    <b>方块交互：</b> 左键放置方块 · 右键破坏方块 · 数字键 1~4 切换方块
                </p>
                <p class="hint-mobile">
                    <b>移动端：</b> 左屏摇杆移动 · 右屏拖动视角<br />
                    破坏 / 放置按钮在右下角
                </p>
                <button id="start-btn">点击开始</button>
            </div>
        </div>

        <!-- 移动端控制 UI -->
        <div id="mobile-controls">
            <!-- 左下：方向摇杆 -->
            <div id="joystick-zone">
                <div id="joystick-base">
                    <div id="joystick-knob"></div>
                </div>
            </div>
            <!-- 右下：操作按钮 -->
            <div id="action-buttons">
                <button id="btn-jump" class="action-btn">跳</button>
                <button id="btn-break" class="action-btn break">破坏</button>
                <button id="btn-place" class="action-btn place">放置</button>
            </div>
            <!-- 顶部：方块选择栏 -->
            <div id="hotbar">
                <div class="slot active" data-block="1"><span>1</span></div>
                <div class="slot" data-block="2"><span>2</span></div>
                <div class="slot" data-block="3"><span>3</span></div>
                <div class="slot" data-block="4"><span>4</span></div>
            </div>
        </div>

        <!-- 调试信息 -->
        <div id="hud">FPS: 0</div>
    </div>

    <!-- Three.js 核心库（CDN），使用 UMD 版本以便普通 script 标签加载 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <!-- 游戏脚本，按依赖顺序加载 -->
    <script src="js/blocks.js"></script>
    <script src="js/world.js"></script>
    <script src="js/player.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
