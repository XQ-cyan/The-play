<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>屑青，生日快乐！</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }

  #canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; }

  #content { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }

  #title { font-size: 2.5rem; font-weight: bold; color: #fff; margin-bottom: 30px; text-shadow: 0 0 20px rgba(100,200,255,0.8), 0 0 40px rgba(100,200,255,0.5); line-height: 1.3; }

  .subtitle { font-size: 1.1rem; color: #ffd24a; margin-bottom: 15px; text-shadow: 0 0 15px rgba(255,210,74,0.6); }

  #message { font-size: 1rem; color: #b0ffc0; line-height: 1.8; max-width: 600px; text-shadow: 0 0 10px rgba(176,255,192,0.5); }

  .char { opacity: 0; transition: opacity 0.3s; }

  #music-btn { position: fixed; bottom: max(20px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 3; background: rgba(100,200,255,0.2); border: 2px solid rgba(100,200,255,0.6); border-radius: 50%; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; }
  #music-btn:hover { transform: translateX(-50%) scale(1.1); background: rgba(100,200,255,0.3); }
  #music-btn:active { transform: translateX(-50%) scale(0.95); }

  .music-icon { width: 24px; height: 24px; fill: #64c8ff; }

  #footer { position: fixed; bottom: max(10px, env(safe-area-inset-bottom)); right: 20px; z-index: 3; font-size: 0.75rem; color: rgba(255,255,255,0.3); }

  #click-hint { position: fixed; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.9); color: #fff; font-size: 1.2rem; }
  #click-hint.hidden { display: none; }
  #click-hint .hint-icon { font-size: 4rem; margin-bottom: 20px; animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 0.4; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.05); } }

  #characters { position: fixed; top: 20px; left: 20px; z-index: 2; display: flex; gap: 8px; flex-wrap: wrap; }
  .char-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; animation: float 3s ease-in-out infinite; }
  .char-icon:nth-child(odd) { animation-delay: 0.5s; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  @media (max-width: 480px) {
    #title { font-size: 1.6rem; }
    .subtitle { font-size: 0.9rem; }
    #message { font-size: 0.85rem; }
    .char-icon { width: 28px; height: 28px; font-size: 14px; }
    #music-btn { width: 48px; height: 48px; }
    .music-icon { width: 20px; height: 20px; }
  }
  @media (min-width: 768px) {
    #title { font-size: 3.5rem; }
    .subtitle { font-size: 1.4rem; }
    #message { font-size: 1.2rem; }
    .char-icon { width: 44px; height: 44px; font-size: 22px; }
  }
</style>
</head>
<body>

<div id="click-hint">
  <div class="hint-icon">🎂</div>
  <div>点击屏幕开启生日祝福</div>
</div>

<canvas id="canvas"></canvas>

<div id="characters" class="hidden">
  <div class="char-icon" style="background:linear-gradient(135deg,#ff6496,#ff8c00);color:#fff;">屑</div>
  <div class="char-icon" style="background:linear-gradient(135deg,#00f0ff,#00b3ff);color:#fff;">青</div>
  <div class="char-icon" style="background:linear-gradient(135deg,#ffd24a,#ff6496);color:#fff;">X</div>
  <div class="char-icon" style="background:linear-gradient(135deg,#b026ff,#ff2d95);color:#fff;">Q</div>
</div>

<div id="content">
  <div id="title">屑青，生日快乐！</div>
  <div class="subtitle">虽然晚了一天，但祝福从不缺席！</div>
  <div id="message">
    <div><span class="char">生</span><span class="char">日</span><span class="char">快</span><span class="char">乐</span><span class="char">呀</span><span class="char">，</span><span class="char">屑</span><span class="char">青</span><span class="char">！</span><span class="char">虽</span><span class="char">然</span><span class="char">迟</span><span class="char">到</span><span class="char">了</span><span class="char">一</span><span class="char">天</span><span class="char">，</span><span class="char">但</span><span class="char">真</span><span class="char">心</span><span class="char">不</span><span class="char">少</span><span class="char">一</span><span class="char">分</span><span class="char">。</span></div>
    <div style="margin-top: 15px;"><span class="char">愿</span><span class="char">你</span><span class="char">代</span><span class="char">码</span><span class="char">永</span><span class="char">不</span><span class="char">Bug</span><span class="char">，</span><span class="char">项</span><span class="char">目</span><span class="char">次</span><span class="char">次</span><span class="char">成</span><span class="char">功</span><span class="char">，</span><span class="char">好</span><span class="char">运</span><span class="char">满</span><span class="char">满</span><span class="char">，</span><span class="char">万</span><span class="char">事</span><span class="char">顺</span><span class="char">心</span><span class="char">！</span></div>
    <div style="margin-top: 15px;"><span class="char">屑</span><span class="char">家</span><span class="char">庄</span><span class="char">全</span><span class="char">员</span><span class="char">祝</span><span class="char">你</span><span class="char">岁</span><span class="char">岁</span><span class="char">开</span><span class="char">心</span><span class="char">，</span><span class="char">天</span><span class="char">天</span><span class="char">快</span><span class="char">乐</span><span class="char">！</span></div>
  </div>
</div>

<div id="music-btn" class="hidden">
  <svg id="music-icon" class="music-icon" viewBox="0 0 24 24">
    <path d="M8 5v14l11-7z"/>
  </svg>
</div>

<div id="footer">屑青原创制作</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

let fireworks = [];
let particles = [];

class Firework {
  constructor() {
    this.x = Math.random() * W;
    this.y = H;
    this.targetY = Math.random() * (H * 0.5) + 50;
    this.speed = Math.random() * 8 + 10;
    this.angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.3;
    this.vx = Math.cos(this.angle) * this.speed;
    this.vy = Math.sin(this.angle) * this.speed;
    this.hue = Math.random() * 360;
    this.trail = [];
    this.exploded = false;
  }
  update() {
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 20) this.trail.shift();
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.15;
    if (this.vy >= 0 || this.y <= this.targetY) {
      this.explode();
      this.exploded = true;
    }
  }
  explode() {
    const count = Math.floor(Math.random() * 60) + 80;
    for (let i = 0; i < count; i++) {
      particles.push(new Particle(this.x, this.y, this.hue));
    }
  }
  draw() {
    ctx.beginPath();
    for (let i = 0; i < this.trail.length; i++) {
      const p = this.trail[i];
      ctx.globalAlpha = i / this.trail.length * 0.8;
      ctx.lineTo(p.x, p.y);
    }
    ctx.strokeStyle = `hsl(${this.hue}, 100%, 60%)`;
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = `hsl(${this.hue}, 100%, 70%)`;
    ctx.fill();
  }
}

class Particle {
  constructor(x, y, hue) {
    this.x = x;
    this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 6 + 2;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.hue = hue + (Math.random() - 0.5) * 60;
    this.life = 1;
    this.decay = Math.random() * 0.02 + 0.015;
    this.gravity = 0.05;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += this.gravity;
    this.vx *= 0.96;
    this.vy *= 0.96;
    this.life -= this.decay;
  }
  draw() {
    ctx.globalAlpha = this.life;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
    ctx.fillStyle = `hsl(${this.hue}, 100%, 60%)`;
    ctx.fill();
    ctx.shadowBlur = 10;
    ctx.shadowColor = `hsl(${this.hue}, 100%, 60%)`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
}

class Star {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.r = Math.random() * 2 + 0.5;
    this.speed = Math.random() * 0.5 + 0.2;
    this.twinkle = Math.random() * Math.PI * 2;
  }
  update() {
    this.y += this.speed;
    this.twinkle += 0.05;
    if (this.y > H) this.reset();
  }
  draw() {
    const alpha = 0.3 + Math.sin(this.twinkle) * 0.4;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

let stars = [];
for (let i = 0; i < 100; i++) stars.push(new Star());

let fireworkTimer = 0;
let nextFirework = 500;

function animate() {
  requestAnimationFrame(animate);
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(0, 0, W, H);

  for (const s of stars) { s.update(); s.draw(); }

  if (Math.random() < 0.02 || fireworkTimer >= nextFirework) {
    fireworks.push(new Firework());
    fireworkTimer = 0;
    nextFirework = Math.random() * 1000 + 500;
  }
  fireworkTimer++;

  for (let i = fireworks.length - 1; i >= 0; i--) {
    fireworks[i].update();
    fireworks[i].draw();
    if (fireworks[i].exploded) fireworks.splice(i, 1);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw();
    if (particles[i].life <= 0) particles.splice(i, 1);
  }
}

let audioCtx = null;
let isPlaying = false;

const HAPPY_BIRTHDAY = [
  { note: 60, dur: 0.5 }, { note: 60, dur: 0.5 }, { note: 62, dur: 1 }, { note: 60, dur: 1 }, { note: 65, dur: 1 }, { note: 64, dur: 2 },
  { note: 60, dur: 0.5 }, { note: 60, dur: 0.5 }, { note: 62, dur: 1 }, { note: 60, dur: 1 }, { note: 67, dur: 1 }, { note: 65, dur: 2 },
  { note: 60, dur: 0.5 }, { note: 60, dur: 0.5 }, { note: 72, dur: 1 }, { note: 69, dur: 1 }, { note: 65, dur: 1 }, { note: 64, dur: 1 }, { note: 62, dur: 2 },
  { note: 64, dur: 0.5 }, { note: 64, dur: 0.5 }, { note: 62, dur: 1 }, { note: 60, dur: 1 }, { note: 62, dur: 1 }, { note: 64, dur: 2 }, { note: 65, dur: 2 },
];

function playMusic() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }

  let time = audioCtx.currentTime;
  HAPPY_BIRTHDAY.forEach(n => {
    playNote(n.note, time, n.dur);
    time += n.dur;
  });
  isPlaying = true;
  updateMusicIcon();
}

function playNote(note, time, duration) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = 'sine';
  osc.frequency.value = 440 * Math.pow(2, (note - 69) / 12);
  gain.gain.setValueAtTime(0, time);
  gain.gain.linearRampToValueAtTime(0.3, time + 0.05);
  gain.gain.linearRampToValueAtTime(0, time + duration - 0.05);
  osc.start(time);
  osc.stop(time + duration);
}

function toggleMusic() {
  if (isPlaying) {
    if (audioCtx) {
      audioCtx.close();
      audioCtx = null;
    }
    isPlaying = false;
  } else {
    playMusic();
  }
  updateMusicIcon();
}

function updateMusicIcon() {
  const icon = document.getElementById('music-icon');
  if (isPlaying) {
    icon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
  } else {
    icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
  }
}

function typeWriter() {
  const chars = document.querySelectorAll('.char');
  let i = 0;
  const type = () => {
    if (i < chars.length) {
      chars[i].style.opacity = 1;
      i++;
      setTimeout(type, Math.random() * 50 + 30);
    }
  };
  setTimeout(type, 500);
}

function init() {
  document.getElementById('click-hint').classList.add('hidden');
  document.getElementById('characters').classList.remove('hidden');
  document.getElementById('music-btn').classList.remove('hidden');
  typeWriter();
  playMusic();
}

document.addEventListener('click', () => {
  if (document.getElementById('click-hint').classList.contains('hidden')) return;
  init();
});

document.getElementById('music-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  toggleMusic();
});

animate();
</script>
</body>
</html>
